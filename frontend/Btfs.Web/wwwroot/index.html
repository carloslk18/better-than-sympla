<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BTFS – Descubra e compre ingressos para os melhores eventos do Brasil." />
    <title>BTFS – Better Than Sympla</title>
    <base href="/" />
    <!-- Google Fonts: Inter (corpo) + Syne (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Btfs.styles.css" rel="stylesheet" />
    <script>
        // Prevenir "Flash of Unstyled Content" - executa antes de renderizar o body
        (function() {
            var theme = window.localStorage.getItem('theme');
            if (theme === 'light') {
                document.documentElement.classList.add('theme-light');
            }
        })();

        // Objeto global para interação com C# (Blazor JS Interop)
        window.themeInterop = {
            setTheme: function (theme) {
                window.localStorage.setItem('theme', theme);
                if (theme === 'light') {
                    document.documentElement.classList.add('theme-light');
                } else {
                    document.documentElement.classList.remove('theme-light');
                }
            },
            getTheme: function () {
                return window.localStorage.getItem('theme') || 'dark';
            }
        };
    </script>
</head>

<body>
    <div id="app">
        <div class="btfs-loading">
            <div class="btfs-loading__spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
